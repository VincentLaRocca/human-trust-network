[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ivan_vaughan"
version = "0.1.0"
description = "Ivan Vaughan Primitive: Zero-trust collaborator-introduction protocol"
requires-python = ">=3.10"
dependencies = [
    "fido2>=2.0",
    "cbor2>=5.4",
    "cryptography>=41.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
